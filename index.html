<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 영단어 8930</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0e0e10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="영단어">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0e0e10; --surface: #18181c; --surface2: #222228; --border: #2e2e38;
    --accent: #f4c842; --accent2: #e87c3e; --danger: #e05555;
    --text: #f0ede6; --muted: #888890; --card-bg: #1c1c22;
  }
  body { background: var(--bg); color: var(--text); font-family: 'Space Mono', monospace; min-height: 100vh; }

  header {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 16px 28px; display: flex; align-items: center; gap: 16px;
    position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px); flex-wrap: wrap;
  }
  .logo { font-size: 20px; font-weight: 700; color: var(--accent); letter-spacing: -1px; white-space: nowrap; }
  .logo span { color: var(--accent2); }
  .search-wrap { flex: 1; position: relative; max-width: 560px; min-width: 180px; }
  .search-icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 15px; pointer-events: none; }
  #searchInput {
    width: 100%; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 13px 10px 37px; color: var(--text);
    font-family: 'Space Mono', monospace; font-size: 14px; outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  #searchInput:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(244,200,66,.15); }
  #searchInput::placeholder { color: var(--muted); }
  .mode-btns { display: flex; gap: 5px; flex-shrink: 0; flex-wrap: wrap; }
  .mode-btn {
    background: var(--surface2); border: 1px solid var(--border); color: var(--muted);
    font-family: 'Space Mono', monospace; font-size: 11px; padding: 7px 11px;
    border-radius: 8px; cursor: pointer; transition: all .15s; white-space: nowrap;
  }
  .mode-btn.active { background: var(--accent); border-color: var(--accent); color: #111; font-weight: 700; }
  .mode-btn:hover:not(.active) { border-color: var(--accent); color: var(--accent); }
  .mode-btn.danger:hover:not(.active) { border-color: var(--danger); color: var(--danger); }

  .stats-bar {
    padding: 8px 28px; background: var(--surface); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--muted); flex-wrap: wrap;
  }
  .stats-bar .count { color: var(--accent); font-weight: 700; }
  .stats-bar .deleted-count { color: var(--danger); font-weight: 700; }

  /* QUIZ */
  #quizBanner { display: none; background: linear-gradient(135deg,#1a1600,#1e1200); border-bottom: 2px solid var(--accent); padding: 18px 28px; }
  #quizBanner.active { display: block; }
  .quiz-card { max-width: 640px; margin: 0 auto; text-align: center; }
  .quiz-label { font-size: 11px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; }
  .quiz-word { font-size: 30px; font-weight: 700; color: var(--accent); margin-bottom: 14px; font-family: 'Noto Serif KR',serif; }
  .quiz-options { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-bottom: 12px; }
  .quiz-opt {
    background: var(--surface2); border: 1px solid var(--border); color: var(--text);
    font-family: 'Noto Serif KR',serif; font-size: 14px; padding: 11px 14px;
    border-radius: 8px; cursor: pointer; transition: all .15s;
  }
  .quiz-opt:hover { border-color: var(--accent); color: var(--accent); }
  .quiz-opt.correct { background: rgba(50,200,100,.15); border-color: #32c864; color: #32c864; }
  .quiz-opt.wrong { background: rgba(220,60,60,.15); border-color: #dc3c3c; color: #dc3c3c; }
  .quiz-score { font-size: 13px; color: var(--muted); }
  .quiz-score span { color: var(--accent); font-weight: 700; }
  .quiz-next-btn { margin-top: 11px; background: var(--accent); border: none; color: #111; font-family: 'Space Mono',monospace; font-size: 13px; font-weight: 700; padding: 9px 22px; border-radius: 8px; cursor: pointer; display: none; }
  .quiz-next-btn.show { display: inline-block; }
  .quiz-actions { display: flex; gap: 7px; justify-content: center; margin-top: 10px; flex-wrap: wrap; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .quiz-actions.show { opacity: 1; pointer-events: auto; }
  .quiz-action-btn {
    background: var(--surface2); border: 1px solid var(--border); color: var(--muted);
    font-family: 'Space Mono', monospace; font-size: 11px; padding: 6px 13px;
    border-radius: 7px; cursor: pointer; transition: all .15s;
  }
  .quiz-action-btn:hover { border-color: var(--accent); color: var(--accent); }
  .quiz-action-btn.bm-active { border-color: var(--accent2); color: var(--accent2); }
  .quiz-action-btn.del-btn:hover { border-color: var(--danger); color: var(--danger); }
  .quiz-action-btn.edit-btn:hover { border-color: #7ec8e3; color: #7ec8e3; }
  .quiz-word-wrap { position: relative; display: inline-block; }

  main { max-width: 1100px; margin: 0 auto; padding: 22px 28px; }
  #results { display: grid; grid-template-columns: repeat(auto-fill, minmax(275px,1fr)); gap: 11px; }

  .word-card {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; cursor: pointer; transition: all .18s; position: relative; overflow: hidden;
  }
  .word-card::before { content:''; position: absolute; left:0;top:0;bottom:0; width:3px; background:var(--border); border-radius:3px 0 0 3px; transition: background .18s; }
  .word-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.3); }
  .word-card:hover::before { background: var(--accent); }
  .word-card.bookmarked::before { background: var(--accent2); }
  .word-card.deleted-card { opacity: .45; border-color: var(--danger); }
  .word-card.deleted-card::before { background: var(--danger); }
  .card-no { font-size: 11px; color: var(--muted); margin-bottom: 5px; }
  .card-en { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 5px; line-height: 1.3; word-break: break-word; }
  .card-kr { font-size: 13px; color: var(--muted); line-height: 1.5; font-family: 'Noto Serif KR',serif; transition: color .15s; }
  .word-card:hover .card-kr { color: #b8b4aa; }
  .card-actions { display: flex; gap: 5px; margin-top: 9px; flex-wrap: wrap; }
  .card-action-btn {
    background: var(--surface2); border: 1px solid var(--border); color: var(--muted);
    font-size: 10px; font-family: 'Space Mono',monospace; padding: 4px 9px;
    border-radius: 6px; cursor: pointer; transition: all .15s;
  }
  .card-action-btn:hover { border-color: var(--accent); color: var(--accent); }
  .card-action-btn.bm-active { border-color: var(--accent2); color: var(--accent2); }
  .card-action-btn.delete-btn:hover { border-color: var(--danger); color: var(--danger); }
  .card-action-btn.restore-btn:hover { border-color: #32c864; color: #32c864; }

  /* MODAL */
  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:200; align-items:center; justify-content:center; padding:20px; backdrop-filter:blur(4px); }
  .modal-overlay.open { display:flex; }
  .modal { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:28px; max-width:480px; width:100%; position:relative; box-shadow:0 24px 60px rgba(0,0,0,.5); }
  .modal-close { position:absolute; top:14px;right:14px; background:var(--surface2); border:1px solid var(--border); color:var(--muted); width:30px;height:30px; border-radius:50%; cursor:pointer; font-size:15px; display:flex;align-items:center;justify-content:center; transition:all .15s; }
  .modal-close:hover { border-color:var(--accent);color:var(--accent); }
  .modal-no { font-size:12px;color:var(--muted);margin-bottom:6px; }
  .modal-en { font-size:26px;font-weight:700;color:var(--accent);margin-bottom:10px;line-height:1.3; }
  .modal-kr { font-size:17px;color:var(--text);font-family:'Noto Serif KR',serif;line-height:1.7;padding:14px;background:var(--surface2);border-radius:10px;border:1px solid var(--border);margin-bottom:14px; }
  .modal-actions { display:flex;gap:8px;flex-wrap:wrap; }
  .modal-btn { background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:'Space Mono',monospace;font-size:12px;padding:8px 14px;border-radius:8px;cursor:pointer;transition:all .15s; }
  .modal-btn:hover { border-color:var(--accent);color:var(--accent); }
  .modal-btn.primary { background:var(--accent);border-color:var(--accent);color:#111;font-weight:700; }
  .modal-btn.primary:hover { opacity:.9; }
  .modal-btn.danger-btn:hover { border-color:var(--danger);color:var(--danger); }
  .modal-btn.success-btn:hover { border-color:#32c864;color:#32c864; }

  /* CONFIRM DIALOG */
  .confirm-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.8); z-index:300; align-items:center; justify-content:center; padding:20px; backdrop-filter:blur(6px); }
  .confirm-overlay.open { display:flex; }
  .confirm-box { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:24px; max-width:380px; width:100%; text-align:center; }
  .confirm-icon { font-size:36px; margin-bottom:12px; }
  .confirm-title { font-size:16px; font-weight:700; color:var(--text); margin-bottom:8px; }
  .confirm-msg { font-size:13px; color:var(--muted); line-height:1.6; margin-bottom:20px; font-family:'Noto Serif KR',serif; }
  .confirm-btns { display:flex; gap:10px; justify-content:center; }
  .confirm-btn { font-family:'Space Mono',monospace; font-size:12px; padding:9px 20px; border-radius:8px; cursor:pointer; font-weight:700; border:1px solid; transition:all .15s; }
  .confirm-btn.cancel-btn { background:var(--surface2); border-color:var(--border); color:var(--muted); }
  .confirm-btn.cancel-btn:hover { border-color:var(--accent); color:var(--accent); }
  .confirm-btn.ok-btn { background:var(--danger); border-color:var(--danger); color:#fff; }
  .confirm-btn.ok-btn:hover { opacity:.85; }

  /* DOWNLOAD TOAST */
  .toast { position:fixed; bottom:24px; right:24px; background:var(--surface); border:1px solid var(--accent); border-radius:10px; padding:12px 18px; font-size:13px; color:var(--accent); z-index:500; transform:translateY(80px); opacity:0; transition:all .3s; }
  .toast.show { transform:translateY(0); opacity:1; }

  .empty { grid-column:1/-1; text-align:center; padding:56px 20px; color:var(--muted); font-size:14px; }
  .empty-icon { font-size:38px; margin-bottom:10px; }

  .pagination { display:flex; align-items:center; justify-content:center; gap:7px; margin-top:26px; flex-wrap:wrap; }
  .page-btn { background:var(--surface2); border:1px solid var(--border); color:var(--muted); font-family:'Space Mono',monospace; font-size:12px; width:34px;height:34px; border-radius:8px; cursor:pointer; transition:all .15s; display:flex;align-items:center;justify-content:center; }
  .page-btn:hover { border-color:var(--accent);color:var(--accent); }
  .page-btn.active { background:var(--accent);border-color:var(--accent);color:#111;font-weight:700; }
  .page-btn:disabled { opacity:.3;cursor:not-allowed; }

  .section-title { font-size:12px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:14px;padding-bottom:7px;border-bottom:1px solid var(--border); }

  /* EDIT / ADD MODAL */
  .edit-modal { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:28px; max-width:480px; width:100%; position:relative; box-shadow:0 24px 60px rgba(0,0,0,.5); }
  .edit-modal h3 { font-size:17px; color:var(--accent); margin-bottom:20px; }
  .form-group { margin-bottom:16px; }
  .form-group label { display:block; font-size:11px; color:var(--muted); letter-spacing:1px; text-transform:uppercase; margin-bottom:7px; }
  .form-group input, .form-group textarea {
    width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:8px;
    padding:10px 13px; color:var(--text); font-family:'Space Mono',monospace; font-size:13px;
    outline:none; transition:border-color .2s, box-shadow .2s; resize:none;
  }
  .form-group input:focus, .form-group textarea:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(244,200,66,.15); }
  .form-group textarea { min-height:80px; font-family:'Noto Serif KR',serif; }
  .form-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:4px; }
  .form-btn { font-family:'Space Mono',monospace; font-size:12px; padding:9px 18px; border-radius:8px; cursor:pointer; font-weight:700; border:1px solid; transition:all .15s; }
  .form-btn.cancel { background:var(--surface2); border-color:var(--border); color:var(--muted); }
  .form-btn.cancel:hover { border-color:var(--accent); color:var(--accent); }
  .form-btn.save { background:var(--accent); border-color:var(--accent); color:#111; }
  .form-btn.save:hover { opacity:.88; }
  .add-btn { background:var(--accent); border:none; color:#111; font-family:'Space Mono',monospace; font-size:11px; font-weight:700; padding:7px 13px; border-radius:8px; cursor:pointer; transition:opacity .15s; white-space:nowrap; flex-shrink:0; }
  .add-btn:hover { opacity:.88; }
  .card-action-btn.edit-btn:hover { border-color:#7ec8e3; color:#7ec8e3; }
  .modal-btn.edit-modal-btn:hover { border-color:#7ec8e3; color:#7ec8e3; }

  ::-webkit-scrollbar { width:5px; }
  ::-webkit-scrollbar-track { background:var(--bg); }
  ::-webkit-scrollbar-thumb { background:var(--border);border-radius:3px; }

  mark { background:rgba(244,200,66,.22);color:var(--accent);border-radius:3px;padding:0 2px; }

  @media(max-width:600px) {
    header { padding:12px 14px;gap:8px; }
    main { padding:14px; }
    .stats-bar { padding:7px 14px; }
    .quiz-word { font-size:22px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">WORD<span>S</span></div>
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="영어 또는 한국어로 검색..." autocomplete="off" spellcheck="false">
  </div>
  <div class="mode-btns">
    <button class="mode-btn active" onclick="setMode('all')">전체</button>
    <button class="mode-btn" onclick="setMode('bookmark')">★ 즐겨찾기</button>
    <button class="mode-btn" onclick="setMode('deleted')">🗑 삭제됨</button>
    <button class="mode-btn" onclick="toggleQuiz()">🎯 퀴즈</button>
    <button class="mode-btn danger" onclick="downloadExcel()">📥 엑셀</button>
    <button class="mode-btn" onclick="triggerImport()" style="border-color:#7ec8e3;color:#7ec8e3;">📤 불러오기</button>
    <input type="file" id="importFile" accept=".csv" style="display:none" onchange="importCSV(this)">
    <button class="add-btn" onclick="openEditModal(null)">＋ 단어 추가</button>
  </div>
</header>

<div class="stats-bar">
  <span id="statsText">총 <span class="count">8,929</span>개 단어</span>
  <span id="deletedInfo" style="display:none">삭제됨 <span class="deleted-count" id="deletedCnt">0</span>개</span>
</div>

<div id="quizBanner">
  <div class="quiz-card">
    <div class="quiz-label">Quiz Mode</div>
    <div class="quiz-word" id="quizWord"></div>
    <div class="quiz-options" id="quizOptions"></div>
    <div class="quiz-actions" id="quizActions">
      <button class="quiz-action-btn" id="quizBmBtn" onclick="quizToggleBm()">☆ 즐겨찾기</button>
      <button class="quiz-action-btn edit-btn" onclick="quizEdit()">✏ 수정</button>
      <button class="quiz-action-btn del-btn" id="quizDelBtn" onclick="quizDelete()">🗑 삭제</button>
    </div>
    <div class="quiz-score">정답 <span id="quizCorrect">0</span> / 시도 <span id="quizTotal">0</span></div>
    <button class="quiz-next-btn" id="quizNextBtn" onclick="nextQuiz()">다음 문제 →</button>
  </div>
</div>

<main>
  <div id="sectionTitle" class="section-title" style="display:none"></div>
  <div id="results"></div>
  <div class="pagination" id="pagination"></div>
</main>

<!-- Detail Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModalClick(event)">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-no" id="modalNo"></div>
    <div class="modal-en" id="modalEn"></div>
    <div class="modal-kr" id="modalKr"></div>
    <div class="modal-actions">
      <button class="modal-btn primary" onclick="speakWord()">🔊 발음듣기</button>
      <button class="modal-btn" id="modalBmBtn" onclick="toggleBookmarkModal()">★ 즐겨찾기</button>
      <button class="modal-btn edit-modal-btn" onclick="editFromModal()">✏ 수정</button>
      <button class="modal-btn danger-btn" id="modalDelBtn" onclick="deleteFromModal()">🗑 삭제</button>
    </div>
  </div>
</div>

<!-- Confirm Dialog -->
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <div class="confirm-icon" id="confirmIcon">🗑</div>
    <div class="confirm-title" id="confirmTitle">단어를 삭제할까요?</div>
    <div class="confirm-msg" id="confirmMsg"></div>
    <div class="confirm-btns">
      <button class="confirm-btn cancel-btn" onclick="confirmCancel()">취소</button>
      <button class="confirm-btn ok-btn" id="confirmOkBtn" onclick="confirmOk()">삭제</button>
    </div>
  </div>
</div>

<!-- Edit / Add Word Modal -->
<div class="modal-overlay" id="editOverlay" onclick="closeEditClick(event)">
  <div class="edit-modal">
    <button class="modal-close" onclick="closeEditModal()">✕</button>
    <h3 id="editModalTitle">단어 추가</h3>
    <div class="form-group">
      <label>영어</label>
      <input type="text" id="editEn" placeholder="영어 단어 또는 표현" autocomplete="off" spellcheck="false">
    </div>
    <div class="form-group">
      <label>한국어</label>
      <textarea id="editKr" placeholder="한국어 뜻 (여러 뜻은 쉼표로 구분)"></textarea>
    </div>
    <div class="form-actions">
      <button class="form-btn cancel" onclick="closeEditModal()">취소</button>
      <button class="form-btn save" onclick="saveWord()">저장</button>
    </div>
  </div>
</div>

<!-- Toast -->

// ─── STATE ────────────────────────────────────────────────
let mode = 'all';
let query = '';
let page = 1;
const PER_PAGE = 40;
let bookmarks = new Set(JSON.parse(localStorage.getItem('bm') || '[]'));
let deleted = new Set(JSON.parse(localStorage.getItem('del') || '[]'));
let filtered = [];
let quizActive = false;
let quizScore = { c: 0, t: 0 };
let modalWord = null;
let confirmCallback = null;

// ─── PERSIST ──────────────────────────────────────────────
function saveBm() { localStorage.setItem('bm', JSON.stringify([...bookmarks])); }
function saveDel() { localStorage.setItem('del', JSON.stringify([...deleted])); }

// ─── HELPERS ──────────────────────────────────────────────
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function highlight(text, q) {
  if (!q) return escHtml(text);
  const safe = escHtml(text);
  const safeQ = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return safe.replace(new RegExp('(' + safeQ + ')', 'gi'), '<mark>$1</mark>');
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

// ─── FILTER ───────────────────────────────────────────────
function getFiltered() {
  const q = query.trim().toLowerCase();
  let pool;
  if (mode === 'bookmark') pool = WORDS.filter(w => bookmarks.has(w[0]) && !deleted.has(w[0]));
  else if (mode === 'deleted') pool = WORDS.filter(w => deleted.has(w[0]));
  else pool = WORDS.filter(w => !deleted.has(w[0]));
  if (!q) return pool;
  return pool.filter(w => w[1].toLowerCase().includes(q) || w[2].toLowerCase().includes(q));
}

// ─── RENDER ───────────────────────────────────────────────
function render() {
  filtered = getFiltered();
  const total = filtered.length;
  const totalPages = Math.max(1, Math.ceil(total / PER_PAGE));
  if (page > totalPages) page = 1;

  const q = query.trim();
  // stats bar
  let statsHTML;
  if (mode === 'deleted') {
    statsHTML = `삭제된 단어 <span class="deleted-count">${total.toLocaleString()}</span>개`;
  } else if (q) {
    statsHTML = `<span class="count">${total.toLocaleString()}</span>개 결과 — "${q}"`;
  } else {
    const activeCount = WORDS.length - deleted.size;
    statsHTML = `총 <span class="count">${activeCount.toLocaleString()}</span>개 단어`;
  }
  document.getElementById('statsText').innerHTML = statsHTML;

  // deleted info in header bar
  const di = document.getElementById('deletedInfo');
  document.getElementById('deletedCnt').textContent = deleted.size;
  di.style.display = deleted.size > 0 ? 'inline' : 'none';

  // section title
  const st = document.getElementById('sectionTitle');
  if (mode === 'bookmark') { st.style.display='block'; st.textContent=`★ 즐겨찾기 (${total}개)`; }
  else if (mode === 'deleted') { st.style.display='block'; st.textContent=`🗑 삭제된 단어 (${total}개)`; }
  else { st.style.display='none'; }

  // cards
  const slice = filtered.slice((page-1)*PER_PAGE, page*PER_PAGE);
  const container = document.getElementById('results');
  const qLow = q.toLowerCase();

  if (slice.length === 0) {
    let emptyMsg;
    if (mode === 'bookmark') emptyMsg = '즐겨찾기가 없습니다.';
    else if (mode === 'deleted') emptyMsg = '삭제된 단어가 없습니다.';
    else emptyMsg = '검색 결과가 없습니다.';
    container.innerHTML = `<div class="empty"><div class="empty-icon">${mode==='deleted'?'🗑':'🔍'}</div>${emptyMsg}</div>`;
  } else {
    container.innerHTML = slice.map(w => {
      const [no, en, kr] = w;
      const isDel = deleted.has(no);
      const isBm = bookmarks.has(no);
      const bmCls = isBm ? 'bookmarked' : '';
      const delCls = isDel ? 'deleted-card' : '';
      const bmBtnCls = isBm ? 'bm-active' : '';
      const bmBtnText = isBm ? '★' : '☆';
      const actionBtn = isDel
        ? `<button class="card-action-btn restore-btn" onclick="event.stopPropagation();restoreWord(${no})">↩ 복구</button>`
        : `<button class="card-action-btn delete-btn" onclick="event.stopPropagation();promptDelete(${no})">🗑 삭제</button>`;
      return `<div class="word-card ${bmCls} ${delCls}" onclick="openModal(${no})">
        <div class="card-no">#${String(no).padStart(4,'0')}</div>
        <div class="card-en">${highlight(en, qLow)}</div>
        <div class="card-kr">${highlight(kr, qLow)}</div>
        <div class="card-actions">
          ${isDel ? '' : `<button class="card-action-btn ${bmBtnCls}" onclick="event.stopPropagation();toggleBm(${no})">${bmBtnText} 즐겨찾기</button>`}
          <button class="card-action-btn" onclick="event.stopPropagation();speakWordById(${no})">🔊</button>
          ${isDel ? '' : `<button class="card-action-btn edit-btn" onclick="event.stopPropagation();openEditModal(${no})">✏ 수정</button>`}
          ${actionBtn}
        </div>
      </div>`;
    }).join('');
  }
  renderPagination(totalPages);
}

function renderPagination(totalPages) {
  const pg = document.getElementById('pagination');
  if (totalPages <= 1) { pg.innerHTML = ''; return; }
  let html = `<button class="page-btn" onclick="goPage(${page-1})" ${page<=1?'disabled':''}>‹</button>`;
  let start = Math.max(1, page-2), end = Math.min(totalPages, page+2);
  if (start > 1) { html += `<button class="page-btn" onclick="goPage(1)">1</button>`; if(start>2) html += `<span style="color:var(--muted);padding:0 4px">…</span>`; }
  for (let i=start;i<=end;i++) html += `<button class="page-btn ${i===page?'active':''}" onclick="goPage(${i})">${i}</button>`;
  if (end < totalPages) { if(end<totalPages-1) html += `<span style="color:var(--muted);padding:0 4px">…</span>`; html += `<button class="page-btn" onclick="goPage(${totalPages})">${totalPages}</button>`; }
  html += `<button class="page-btn" onclick="goPage(${page+1})" ${page>=totalPages?'disabled':''}>›</button>`;
  pg.innerHTML = html;
}

function goPage(p) { page = p; render(); window.scrollTo({top:0,behavior:'smooth'}); }

// ─── MODE ─────────────────────────────────────────────────
function setMode(m) {
  mode = m;
  page = 1;
  const modes = ['all','bookmark','deleted'];
  document.querySelectorAll('.mode-btn').forEach((b,i) => {
    if (i < modes.length) b.classList.toggle('active', modes[i] === m);
    else b.classList.remove('active');
  });
  render();
}

// ─── BOOKMARK ─────────────────────────────────────────────
function toggleBm(no) {
  if (bookmarks.has(no)) bookmarks.delete(no); else bookmarks.add(no);
  saveBm(); render();
}
function toggleBookmarkModal() {
  if (!modalWord) return;
  const no = modalWord[0];
  if (bookmarks.has(no)) bookmarks.delete(no); else bookmarks.add(no);
  saveBm();
  updateModalBmBtn();
  render();
}
function updateModalBmBtn() {
  if (!modalWord) return;
  const bm = bookmarks.has(modalWord[0]);
  const btn = document.getElementById('modalBmBtn');
  btn.textContent = bm ? '★ 즐겨찾기 해제' : '☆ 즐겨찾기 추가';
  btn.style.borderColor = bm ? 'var(--accent2)' : '';
  btn.style.color = bm ? 'var(--accent2)' : '';
}

// ─── DELETE ───────────────────────────────────────────────
function promptDelete(no) {
  const w = WORDS.find(x => x[0] === no);
  if (!w) return;
  showConfirm({
    icon: '🗑',
    title: '단어를 삭제할까요?',
    msg: `"${w[1]}" (${w[2].slice(0,20)}${w[2].length>20?'…':''}) 을 삭제합니다.<br><small style="color:var(--muted);font-size:11px">삭제된 단어는 '삭제됨' 탭에서 복구할 수 있습니다.</small>`,
    okLabel: '삭제',
    onOk: () => { deleteWord(no); }
  });
}
function deleteWord(no) {
  deleted.add(no);
  bookmarks.delete(no);
  saveDel(); saveBm();
  closeModal();
  render();
  if (quizActive && quizCurrentNo === no) updateQuizActionBtns();
  showToast('단어가 삭제되었습니다. 삭제됨 탭에서 복구할 수 있습니다.');
}
function restoreWord(no) {
  deleted.delete(no);
  saveDel(); render();
  if (quizActive && quizCurrentNo === no) updateQuizActionBtns();
  showToast('단어가 복구되었습니다.');
}
function deleteFromModal() {
  if (!modalWord) return;
  const no = modalWord[0];
  const isDel = deleted.has(no);
  if (isDel) { restoreWord(no); closeModal(); return; }
  promptDelete(no);
}
function updateModalDelBtn() {
  if (!modalWord) return;
  const isDel = deleted.has(modalWord[0]);
  const btn = document.getElementById('modalDelBtn');
  if (isDel) {
    btn.textContent = '↩ 복구';
    btn.classList.add('success-btn');
    btn.classList.remove('danger-btn');
  } else {
    btn.textContent = '🗑 삭제';
    btn.classList.add('danger-btn');
    btn.classList.remove('success-btn');
  }
}

// ─── CONFIRM DIALOG ───────────────────────────────────────
function showConfirm({icon, title, msg, okLabel, onOk}) {
  document.getElementById('confirmIcon').textContent = icon || '❓';
  document.getElementById('confirmTitle').textContent = title;
  document.getElementById('confirmMsg').innerHTML = msg;
  document.getElementById('confirmOkBtn').textContent = okLabel || '확인';
  confirmCallback = onOk;
  document.getElementById('confirmOverlay').classList.add('open');
}
function confirmOk() { document.getElementById('confirmOverlay').classList.remove('open'); if(confirmCallback) confirmCallback(); confirmCallback = null; }
function confirmCancel() { document.getElementById('confirmOverlay').classList.remove('open'); confirmCallback = null; }

// ─── MODAL ────────────────────────────────────────────────
function openModal(no) {
  const w = WORDS.find(x => x[0] === no);
  if (!w) return;
  modalWord = w;
  document.getElementById('modalNo').textContent = '#' + String(no).padStart(4,'0');
  document.getElementById('modalEn').textContent = w[1];
  document.getElementById('modalKr').textContent = w[2];
  updateModalBmBtn();
  updateModalDelBtn();
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }
function closeModalClick(e) { if (e.target === document.getElementById('modalOverlay')) closeModal(); }

// ─── SPEECH ───────────────────────────────────────────────
function speakWord() { if (modalWord) speak(modalWord[1]); }
function speakWordById(no) { const w = WORDS.find(x=>x[0]===no); if(w) speak(w[1]); }
function speak(text) {
  if (!window.speechSynthesis) return alert('이 브라우저는 음성 합성을 지원하지 않습니다.');
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  window.speechSynthesis.speak(u);
}

// ─── QUIZ ─────────────────────────────────────────────────
let quizCurrentNo = null; // tracks the current question's correct word

function toggleQuiz() {
  quizActive = !quizActive;
  document.querySelectorAll('.mode-btn')[3].classList.toggle('active', quizActive);
  document.getElementById('quizBanner').classList.toggle('active', quizActive);
  if (quizActive) nextQuiz();
}
function nextQuiz() {
  const pool = (mode === 'bookmark' && bookmarks.size > 3)
    ? WORDS.filter(w => bookmarks.has(w[0]) && !deleted.has(w[0]))
    : WORDS.filter(w => !deleted.has(w[0]));
  if (pool.length < 4) { showToast('단어가 부족합니다.'); return; }
  const correct = pool[Math.floor(Math.random() * pool.length)];
  quizCurrentNo = correct[0];
  const options = [correct];
  while (options.length < 4) {
    const r = pool[Math.floor(Math.random() * pool.length)];
    if (!options.find(o => o[0] === r[0])) options.push(r);
  }
  options.sort(() => Math.random() - .5);
  document.getElementById('quizWord').textContent = correct[1];
  document.getElementById('quizNextBtn').classList.remove('show');
  // Hide action buttons until answer is given
  document.getElementById('quizActions').classList.remove('show');
  document.getElementById('quizOptions').innerHTML = options.map(o =>
    `<button class="quiz-opt" onclick="answerQuiz(this,${o[0]===correct[0]},${correct[0]})">${escHtml(o[2])}</button>`
  ).join('');
  updateQuizActionBtns();
}
function answerQuiz(btn, isCorrect, correctNo) {
  document.querySelectorAll('.quiz-opt').forEach(b => b.disabled = true);
  if (isCorrect) { btn.classList.add('correct'); quizScore.c++; }
  else {
    btn.classList.add('wrong');
    document.querySelectorAll('.quiz-opt').forEach(b => { if(b.onclick && String(b.getAttribute('onclick')).includes(',true,')) b.classList.add('correct'); });
  }
  quizScore.t++;
  document.getElementById('quizCorrect').textContent = quizScore.c;
  document.getElementById('quizTotal').textContent = quizScore.t;
  document.getElementById('quizNextBtn').classList.add('show');
  // Show action buttons after answer is revealed
  document.getElementById('quizActions').classList.add('show');
  updateQuizActionBtns();
}

// ─── QUIZ WORD ACTIONS ────────────────────────────────────
function updateQuizActionBtns() {
  if (!quizCurrentNo) return;
  const isBm = bookmarks.has(quizCurrentNo);
  const isDel = deleted.has(quizCurrentNo);
  const bmBtn = document.getElementById('quizBmBtn');
  const delBtn = document.getElementById('quizDelBtn');
  bmBtn.textContent = isBm ? '★ 즐겨찾기 해제' : '☆ 즐겨찾기';
  bmBtn.classList.toggle('bm-active', isBm);
  delBtn.textContent = isDel ? '↩ 복구' : '🗑 삭제';
  delBtn.classList.toggle('del-btn', !isDel);
}
function quizToggleBm() {
  if (!quizCurrentNo) return;
  if (bookmarks.has(quizCurrentNo)) bookmarks.delete(quizCurrentNo);
  else bookmarks.add(quizCurrentNo);
  saveBm(); render(); updateQuizActionBtns();
  showToast(bookmarks.has(quizCurrentNo) ? '★ 즐겨찾기에 추가했습니다.' : '즐겨찾기에서 제거했습니다.');
}
function quizEdit() {
  if (!quizCurrentNo) return;
  openEditModal(quizCurrentNo);
}
function quizDelete() {
  if (!quizCurrentNo) return;
  const isDel = deleted.has(quizCurrentNo);
  if (isDel) {
    restoreWord(quizCurrentNo);
    updateQuizActionBtns();
    return;
  }
  const w = WORDS.find(x => x[0] === quizCurrentNo);
  if (!w) return;
  promptDelete(quizCurrentNo);
}

// ─── EXCEL DOWNLOAD ───────────────────────────────────────
function downloadExcel() {
  // Build CSV with BOM for Excel Korean support
  const rows = [['No','영어','한국어','즐겨찾기','상태']];
  WORDS.forEach(([no, en, kr]) => {
    const isBm = bookmarks.has(no) ? '★' : '';
    const isDel = deleted.has(no) ? '삭제됨' : '정상';
    rows.push([no, en, kr, isBm, isDel]);
  });
  const csv = '\uFEFF' + rows.map(r =>
    r.map(v => {
      const s = String(v);
      return (s.includes(',') || s.includes('"') || s.includes('\n')) ? '"' + s.replace(/"/g,'""') + '"' : s;
    }).join(',')
  ).join('\n');

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '영단어_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
  URL.revokeObjectURL(url);
  showToast('📥 엑셀 파일이 다운로드됩니다!');
}

// ─── CSV IMPORT ───────────────────────────────────────────
function triggerImport() {
  const inp = document.getElementById('importFile');
  inp.value = '';
  inp.click();
}

function importCSV(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      let text = e.target.result;
      // Strip BOM if present
      if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);

      const rows = parseCSV(text);
      if (rows.length < 2) { showToast('⚠ 올바른 CSV 파일이 아닙니다.'); return; }

      // Detect header row
      const header = rows[0].map(h => h.trim().toLowerCase());
      const noIdx  = header.findIndex(h => h === 'no');
      const enIdx  = header.findIndex(h => h === '영어');
      const krIdx  = header.findIndex(h => h === '한국어');
      const delIdx = header.findIndex(h => h === '상태');
      const bmIdx  = header.findIndex(h => h === '즐겨찾기');

      if (noIdx < 0 || enIdx < 0 || krIdx < 0) {
        showToast('⚠ 헤더(No, 영어, 한국어)를 찾을 수 없습니다.');
        return;
      }

      const newWords = [];
      const newBookmarks = new Set();
      const newDeleted = new Set();

      for (let i = 1; i < rows.length; i++) {
        const r = rows[i];
        if (!r || r.length < 3) continue;
        const no = parseInt(r[noIdx], 10);
        const en = (r[enIdx] || '').trim();
        const kr = (r[krIdx] || '').trim();
        if (!no || !en) continue;
        newWords.push([no, en, kr]);
        if (bmIdx >= 0 && (r[bmIdx] || '').trim() === '★') newBookmarks.add(no);
        if (delIdx >= 0 && (r[delIdx] || '').trim() === '삭제됨') newDeleted.add(no);
      }

      if (newWords.length === 0) { showToast('⚠ 읽어들인 단어가 없습니다.'); return; }

      showConfirm({
        icon: '📤',
        title: 'CSV 불러오기',
        msg: `<b style="color:var(--accent)">${newWords.length.toLocaleString()}개</b> 단어로 전체를 업데이트합니다.<br><small style="color:var(--muted);font-size:11px">즐겨찾기·삭제 상태도 CSV 기준으로 복원됩니다.</small>`,
        okLabel: '업데이트',
        onOk: () => {
          // Replace WORDS array in-place
          WORDS.length = 0;
          newWords.forEach(w => WORDS.push(w));
          bookmarks = newBookmarks;
          deleted   = newDeleted;
          saveBm();
          saveDel();
          saveCustomWords();
          query = '';
          page = 1;
          mode = 'all';
          document.getElementById('searchInput').value = '';
          document.querySelectorAll('.mode-btn').forEach((b, i) => b.classList.toggle('active', i === 0));
          render();
          showToast(`✅ ${newWords.length.toLocaleString()}개 단어로 업데이트 완료!`);
        }
      });
    } catch(err) {
      showToast('⚠ 파일을 읽는 중 오류가 발생했습니다.');
      console.error(err);
    }
  };
  reader.readAsText(file, 'UTF-8');
}

// Proper CSV parser (handles quoted fields with commas/newlines)
function parseCSV(text) {
  const rows = [];
  let row = [], field = '', inQuote = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQuote) {
      if (ch === '"') {
        if (text[i+1] === '"') { field += '"'; i++; }
        else inQuote = false;
      } else {
        field += ch;
      }
    } else {
      if (ch === '"') { inQuote = true; }
      else if (ch === ',') { row.push(field); field = ''; }
      else if (ch === '\r') { /* skip */ }
      else if (ch === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else { field += ch; }
    }
  }
  if (field || row.length) { row.push(field); rows.push(row); }
  return rows;
}

// ─── EDIT / ADD WORD ──────────────────────────────────────
let editingNo = null; // null = add mode, number = edit mode

function openEditModal(no) {
  editingNo = no;
  if (no === null) {
    document.getElementById('editModalTitle').textContent = '단어 추가';
    document.getElementById('editEn').value = '';
    document.getElementById('editKr').value = '';
  } else {
    const w = WORDS.find(x => x[0] === no);
    if (!w) return;
    document.getElementById('editModalTitle').textContent = '단어 수정';
    document.getElementById('editEn').value = w[1];
    document.getElementById('editKr').value = w[2];
  }
  document.getElementById('editOverlay').classList.add('open');
  setTimeout(() => document.getElementById('editEn').focus(), 60);
}

function closeEditModal() {
  document.getElementById('editOverlay').classList.remove('open');
  editingNo = null;
}

function closeEditClick(e) {
  if (e.target === document.getElementById('editOverlay')) closeEditModal();
}

function editFromModal() {
  if (!modalWord) return;
  closeModal();
  openEditModal(modalWord[0]);
}

function saveWord() {
  const en = document.getElementById('editEn').value.trim();
  const kr = document.getElementById('editKr').value.trim();
  if (!en) { document.getElementById('editEn').focus(); showToast('영어 단어를 입력해주세요.'); return; }
  if (!kr) { document.getElementById('editKr').focus(); showToast('한국어 뜻을 입력해주세요.'); return; }

  if (editingNo === null) {
    // ADD: new word
    const maxNo = WORDS.reduce((m, w) => Math.max(m, w[0]), 0);
    const newNo = maxNo + 1;
    WORDS.push([newNo, en, kr]);
    saveCustomWords();
    closeEditModal();
    mode = 'all';
    query = en;
    document.getElementById('searchInput').value = en;
    page = 1;
    render();
    showToast('✅ 새 단어가 추가되었습니다!');
  } else {
    // EDIT: update existing
    const idx = WORDS.findIndex(x => x[0] === editingNo);
    if (idx === -1) return;
    WORDS[idx][1] = en;
    WORDS[idx][2] = kr;
    // Update modal if it's showing the same word
    if (modalWord && modalWord[0] === editingNo) {
      modalWord = WORDS[idx];
      document.getElementById('modalEn').textContent = en;
      document.getElementById('modalKr').textContent = kr;
    }
    saveCustomWords();
    closeEditModal();
    render();
    // If the edited word is the current quiz word, update the quiz display
    if (quizActive && quizCurrentNo === editingNo) {
      document.getElementById('quizWord').textContent = en;
      updateQuizActionBtns();
    }
    showToast('✅ 단어가 수정되었습니다!');
  }
}

function saveCustomWords() {
  // Persist only added/edited words (no = original max+1 or higher, or changed content)
  localStorage.setItem('customWords', JSON.stringify(WORDS));
}

function loadCustomWords() {
  const saved = localStorage.getItem('customWords');
  if (!saved) return;
  try {
    const parsed = JSON.parse(saved);
    // Merge: update existing entries and append new ones
    const baseNos = new Set(WORDS.map(w => w[0]));
    parsed.forEach(sw => {
      if (baseNos.has(sw[0])) {
        const idx = WORDS.findIndex(w => w[0] === sw[0]);
        if (idx !== -1) WORDS[idx] = sw;
      } else {
        WORDS.push(sw);
      }
    });
  } catch(e) {}
}

// Load custom words on startup
loadCustomWords();

// ─── SERVICE WORKER ───────────────────────────────────────
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js')
      .then(reg => console.log('SW registered:', reg.scope))
      .catch(err => console.log('SW registration failed:', err));
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModal(); closeEditModal(); confirmCancel(); }
});

// ─── SEARCH INPUT ─────────────────────────────────────────
let searchTimer;
document.getElementById('searchInput').addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { query = e.target.value; page = 1; render(); }, 150);
});

// ─── INIT ─────────────────────────────────────────────────
render();
